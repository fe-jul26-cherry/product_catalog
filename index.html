<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Phone catalog</title>
    <style>
      html {
        background: var(--color-bg, #0f1121);
      }

      .app-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .app-loader::after {
        content: '';
        width: 32px;
        height: 32px;
        border: 4px solid var(--color-elements, #3b3e4a);
        border-left-color: var(--color-primary, #f1f2f9);
        border-radius: 50%;
        animation: app-loader-spin 1.2s infinite linear;
      }

      .app-loader-error {
        flex-direction: column;
        gap: 16px;
        color: var(--color-primary, #f1f2f9);
        font-family: sans-serif;
      }

      .app-loader-error::after {
        display: none;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-w9_DKt9i.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C6r0IkMn.css">
  </head>
  <body>
    <div id="root">
      <div
        class="app-loader"
        role="status"
        aria-label="Loading"
      ></div>
    </div>
    <noscript>Please enable JavaScript to use this site.</noscript>
    <script>
      (function () {
        var root = document.getElementById('root');

        function fail(reason) {
          if (!root.querySelector('.app-loader')) {
            return;
          }

          root.innerHTML =
            '<div class="app-loader app-loader-error" role="alert"><p></p><button type="button">Reload</button></div>';
          root.querySelector('p').textContent =
            'The app failed to load: ' + reason;
          root.querySelector('button').onclick = function () {
            location.reload();
          };
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;

            if (target && target.tagName === 'SCRIPT') {
              fail(target.src);
            } else if (event.message) {
              fail(event.message);
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          fail(String(event.reason));
        });
        setTimeout(function () {
          fail('timeout');
        }, 20000);
      })();
    </script>
  </body>
</html>
