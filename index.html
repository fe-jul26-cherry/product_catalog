<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      href="favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="shortcut icon"
      href="favicon/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="favicon/site.webmanifest"
    />
    <meta
      name="theme-color"
      content="#0f1121"
    />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('theme'));
        if (saved && saved.state && saved.state.theme) {
          document.documentElement.dataset.theme = saved.state.theme;
        }
      } catch (error) {}
      try {
        var lang = JSON.parse(localStorage.getItem('language'));
        if (lang && lang.state && lang.state.language) {
          document.documentElement.lang =
            lang.state.language === 'ua' ? 'uk' : 'en';
        }
      } catch (error) {}
    </script>
    <link
      rel="preload"
      href="/src/assets/fonts/Mont-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/Mont-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/Mont-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Phone catalog</title>
    <style>
      html {
        background: var(--color-bg, #0f1121);
      }

      .app-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .app-loader-dot {
        width: 10px;
        height: 10px;
        margin: 0 5px;
        border-radius: 50%;
        background: var(--color-accent, #905bff);
        animation: app-loader-jump 0.5s cubic-bezier(0.77, 0.47, 0.64, 0.28)
          alternate infinite;
      }

      .app-loader-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .app-loader-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      .app-loader-error {
        flex-direction: column;
        gap: 16px;
        color: var(--color-primary, #f1f2f9);
        font-family: sans-serif;
      }

      @keyframes app-loader-jump {
        to {
          transform: translateY(-15px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader-dot {
          animation: app-loader-pulse 1s ease-in-out alternate infinite;
        }

        .app-loader-dot:nth-child(2) {
          animation-delay: 0.2s;
        }

        .app-loader-dot:nth-child(3) {
          animation-delay: 0.4s;
        }

        @keyframes app-loader-pulse {
          to {
            opacity: 0.25;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="app-loader"
        role="status"
        aria-label="Loading"
      >
        <span class="app-loader-dot"></span>
        <span class="app-loader-dot"></span>
        <span class="app-loader-dot"></span>
      </div>
    </div>
    <noscript>Please enable JavaScript to use this site.</noscript>
    <script>
      (function () {
        var root = document.getElementById('root');

        function fail(reason) {
          if (!root.querySelector('.app-loader')) {
            return;
          }

          root.innerHTML =
            '<div class="app-loader app-loader-error" role="alert"><p></p><button type="button">Reload</button></div>';
          root.querySelector('p').textContent =
            'The app failed to load: ' + reason;
          root.querySelector('button').onclick = function () {
            location.reload();
          };
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;

            if (target && target.tagName === 'SCRIPT') {
              fail(target.src);
            } else if (event.message) {
              fail(event.message);
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          fail(String(event.reason));
        });
        setTimeout(function () {
          fail('timeout');
        }, 20000);
      })();
    </script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
